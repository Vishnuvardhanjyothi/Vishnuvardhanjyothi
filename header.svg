<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" role="img" aria-label="Jothi Vishnuvardhan - Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1033">
        <animate attributeName="stop-color" values="#1a1033;#2b1055;#0f2a4a;#1a1033" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b1020">
        <animate attributeName="stop-color" values="#0b1020;#1b0f3a;#0b2a3a;#0b1020" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#7afcff"/>
    </linearGradient>
    <style>
      .name { font: 800 46px 'Segoe UI', Arial, sans-serif; fill: url(#txt); }
      .sub  { font: 500 20px 'Courier New', monospace; fill: #c9d1ff; }
      .tag  { font: 600 14px 'Courier New', monospace; fill: #7afcff; opacity: .85; }
      .float1 { animation: bob 5s ease-in-out infinite; }
      .float2 { animation: bob 7s ease-in-out infinite reverse; }
      .float3 { animation: bob 6s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      .rise { animation: rise 1.4s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <g class="float1"><circle cx="90" cy="60" r="34" fill="#ff6ec7" opacity=".12"/></g>
  <g class="float2"><circle cx="800" cy="70" r="46" fill="#7afcff" opacity=".10"/></g>
  <g class="float3"><circle cx="740" cy="200" r="26" fill="#ffd166" opacity=".12"/></g>

  <text class="tag float1" x="60" y="48">&lt;/&gt; python  •  sql  •  ai/ml</text>
  <text class="name rise" x="60" y="130">Jothi Vishnuvardhan</text>
  <text class="sub rise" x="60" y="172" style="animation-delay:.4s">Software Engineer <tspan class="cursor">_</tspan></text>
  <text class="tag rise" x="60" y="212" style="animation-delay:.8s">turning data &amp; ideas into working software</text>

  <rect x="60" y="226" width="0" height="3" rx="1.5" fill="url(#txt)">
    <animate attributeName="width" from="0" to="780" dur="2.4s" fill="freeze"/>
  </rect>
</svg>
